name: Validate Lovely Card

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --forceExit
      - run: npm run dist
      - name: Check committed distribution
        run: git diff --exit-code -- dist/
